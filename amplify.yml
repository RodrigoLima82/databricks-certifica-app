# AWS Amplify Hosting — build do frontend (SPA React + Vite).
# Configure a env var VITE_API_BASE_URL no console do Amplify apontando para a
# URL pública do backend no App Runner, ex.: https://xxxx.us-east-1.awsapprunner.com/api
#
# SPA routing: no console do Amplify adicione uma regra de rewrite
#   Source: </^[^.]+$|\.(?!(css|js|png|jpg|svg|ico|json)$)([^.]+$)/>   Target: /index.html   Type: 200 (Rewrite)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # vite.config.ts emite o build em backend/static (build.outDir)
    baseDirectory: backend/static
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
